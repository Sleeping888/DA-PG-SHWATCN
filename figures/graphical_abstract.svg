<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1200" viewBox="0 0 3000 1200"><rect width="3000" height="1200" fill="white"/><text x="1500" y="115" text-anchor="middle" font-family="Arial" font-size="68" font-weight="bold" fill="#14314d">Wind-farm power forecasting with a physics-guided graph</text><text x="1500" y="180" text-anchor="middle" font-family="Arial" font-size="39" fill="#485b6b">134 turbines · 10–60 min ahead · three training seeds</text><g font-family="Arial" text-anchor="middle"><rect x="110" y="280" width="580" height="490" rx="32" fill="#e7f4fa" stroke="#2b79a3" stroke-width="8"/><text x="400" y="390" font-size="53" font-weight="bold" fill="#155477">SCADA history</text><text x="400" y="480" font-size="38" fill="#23495f">Wind · direction · power</text><text x="400" y="545" font-size="38" fill="#23495f">3 observed time steps</text><circle cx="315" cy="650" r="28" fill="#51a4c1"/><circle cx="400" cy="650" r="28" fill="#51a4c1"/><circle cx="485" cy="650" r="28" fill="#51a4c1"/><path d="M735 525 L820 525" stroke="#4b687b" stroke-width="14"/><polygon points="820,495 870,525 820,555" fill="#4b687b"/><rect x="885" y="280" width="580" height="490" rx="32" fill="#ecf5e8" stroke="#5d9464" stroke-width="8"/><text x="1175" y="390" font-size="53" font-weight="bold" fill="#336d3c">Directed wake graph</text><text x="1175" y="475" font-size="38" fill="#385f3e">Absolute wind bearing</text><text x="1175" y="540" font-size="38" fill="#385f3e">Three wake scores</text><text x="1175" y="605" font-size="38" fill="#385f3e">Transport time per edge</text><path d="M1510 525 L1595 525" stroke="#4b687b" stroke-width="14"/><polygon points="1595,495 1645,525 1595,555" fill="#4b687b"/><rect x="1660" y="280" width="580" height="490" rx="32" fill="#fff1e5" stroke="#cf8650" stroke-width="8"/><text x="1950" y="390" font-size="53" font-weight="bold" fill="#a05220">Graph learning</text><text x="1950" y="475" font-size="38" fill="#704a2f">Delay-aligned states</text><text x="19